version: '3.8'

services:
  clinic-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Dserver.port=8080 -Dcuba.webContextName=app -Dvaadin.productionMode=false -XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -Dlogging.level.org.eclipse.jetty=DEBUG -Dspring.config.location=file:/app/config/
      - CUBA_JMX_ENABLED=false
      - CUBA_WEB_FORCE_CLEAN_START=true
    volumes:
      - clinic-data:/app/storage
      - clinic-logs:/app/logs
      - clinic-temp:/app/temp
    networks:
      - cuba-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/app"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  clinic-data:
  clinic-logs:
  clinic-temp:

networks:
  cuba-network:
    driver: bridge