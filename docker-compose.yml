version: '3.8'

services:
  clinic-app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - cuba-network
    depends_on:
      sqlserver-dev:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  sqlserver-dev:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Elalmendro.33
      - MSSQL_PID=Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - cuba-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -U SA -P Elalmendro.33 -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  cuba-network:
    driver: bridge

volumes:
  sqlserver-data: