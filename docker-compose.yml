version: '3.8'
services:
  app-core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CUBA_CONF_DIR=/app/config
      - JAVA_OPTS=-Xmx512m
    volumes:
      - ./modules/core/src/com/company/clinic/app-prod.properties:/app/config/app-prod.properties:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3