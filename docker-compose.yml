version: '3.8'

services:
  clinic-app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - clinic-storage:/storage  # Para almacenamiento persistente
      - ./logs:/tmp/logs  # Logs accesibles desde host
      # Elimina el mapeo de /tmp ya que es interno del contenedor

    environment:
      - JAVA_OPTS=-Dserver.port=8080
        -Dcuba.webContextName=app
        -Dvaadin.productionMode=true  # Cambiar a true en producción
        -Dcuba.automaticDatabaseUpdate=false
        -Ddbupdate.enabled=false
        -Dcuba.tempDir=/tmp
        -Dcuba.logDir=/tmp/logs
        -Dcuba.fileStorageDir=/storage
        -Dspring.jmx.enabled=false  # Deshabilitar JMX completamente
        -Djava.io.tmpdir=/tmp
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/app/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Tiempo inicial antes de empezar a chequear
    restart: unless-stopped
    user: "1000"  # Asegurar que corre con el usuario correcto
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clinic-data: