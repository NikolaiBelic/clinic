version: '3.8'

services:
  clinic-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - CUBA_CONF_DIR=/app/config
      - JAVA_OPTS=-Dserver.port=8080 -Dcuba.webContextName=app -Dvaadin.productionMode=true -XX:+UseContainerSupport -XX:MaxRAMPercentage=75
    volumes:
      - clinic-data:/app/storage
      - clinic-logs:/app/logs
      - clinic-temp:/app/temp
    networks:
      - cuba-network
    restart: unless-stopped

volumes:
  clinic-data:
  clinic-logs:
  clinic-temp:

networks:
  cuba-network:
    external: true