version: '3.8'

services:
  clinic-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Dserver.port=8080 -Dcuba.webContextName=app -Dvaadin.productionMode=false -XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -Dcuba.dataSource.jdbcUrl=jdbc:sqlserver://51.178.137.184:1433;databaseName=clinic;encrypt=true;trustServerCertificate=true -Dcuba.dataSource.username=SA -Dcuba.dataSource.password=Elalmendro.33 -Dlogging.level.org.eclipse.jetty=DEBUG -Dspring.config.location=file:/app/config/
      - CUBA_JMX_ENABLED=false
      - CUBA_WEB_FORCE_CLEAN_START=true
    volumes:
      - clinic-data:/app/storage
      - clinic-logs:/app/logs
      - clinic-temp:/app/temp
    networks:
      - cuba-network
    restart: unless-stopped

volumes:
  clinic-data:
  clinic-logs:
  clinic-temp:

networks:
  cuba-network:
    driver: bridge