version: '3.8'

services:
  clinic-app:
    image: clinic:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Dserver.port=8080 -Dcuba.webContextName=app -Dspring.jmx.enabled=false -Dcuba.jmx.enabled=false"
      CUBA_JMX_ENABLED: "false"
      CUBA_WEB_FORCE_CLEAN_START: "true"
    volumes:
      - clinic-data:/app/storage
      - clinic-logs:/app/logs
      - clinic-temp:/app/temp
    networks:
      - app_network

volumes:
  clinic-data:
  clinic-logs:
  clinic-temp:

networks:
  cuba-network:
    driver: bridge