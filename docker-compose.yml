services:
  clinic-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Dserver.port=8080
        -Dcuba.webContextName=app
        -Dvaadin.productionMode=false
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75
        -Dlogging.level.org.eclipse.jetty=DEBUG
      - CUBA_JMX_ENABLED=false
      - CUBA_WEB_FORCE_CLEAN_START=true
    volumes:
      - clinic-data:/app/storage
      - clinic-logs:/app/logs
      - clinic-temp:/app/temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/app/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  clinic-data:
  clinic-logs:
  clinic-temp: