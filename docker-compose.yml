services:
  cuba-app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - cuba-network
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  cuba-network:
    external: true