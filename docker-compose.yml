version: '3.8'

services:
  clinic-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Dserver.port=8080
        -Dcuba.webContextName=app
        -Dvaadin.productionMode=false
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75
        -Dcuba.dataSource.jdbcUrl=jdbc:sqlserver://51.178.137.184:1433;databaseName=clinic;encrypt=true;trustServerCertificate=true
        -Dcuba.dataSource.username=SA
        -Dcuba.dataSource.password=Elalmendro.33
    volumes:
      - clinic-data:/app/storage
      - clinic-logs:/app/logs
      - clinic-temp:/app/temp
    networks:
      cuba-network:
        aliases:
          - clinic-app
    restart: unless-stopped
    # Añade esto para problemas de DNS
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  clinic-data:
  clinic-logs:
  clinic-temp:

networks:
  cuba-network:
    driver: bridge