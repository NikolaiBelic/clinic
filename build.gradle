
buildscript {
    ext.cubaVersion = '7.2.23'
    repositories {
        maven {
            url 'https://repo.cuba-platform.com/content/groups/work'
            credentials {
                username(rootProject.hasProperty('repoUser') ? rootProject['repoUser'] : 'cuba')
                password(rootProject.hasProperty('repoPass') ? rootProject['repoPass'] : 'cuba123')
            }
        }
        mavenCentral()
        maven {
            url 'https://repo.cuba-platform.com/content/groups/premium'
            credentials {
                username('210504022564')
                password('liLUmknW70Uh')
            }
        }
        
    }
    dependencies {
        classpath "com.haulmont.gradle:cuba-plugin:$cubaVersion"
    }
}

def modulePrefix = 'app'

def globalModule = project(":${modulePrefix}-global")
def coreModule = project(":${modulePrefix}-core")
def webModule = project(":${modulePrefix}-web")

def servletApi = 'javax.servlet:javax.servlet-api:3.1.0'

apply(plugin: 'cuba')

cuba {
    artifact {
        group = 'com.company.clinic'
        version = '0.1'
        isSnapshot = true
    }
}

dependencies {
    appComponent("com.haulmont.cuba:cuba-global:$cubaVersion")
    appComponent('com.haulmont.addon.helium:helium-global:0.4.1')
    appComponent ("com.haulmont.reports:reports-global:$cubaVersion")
    appComponent('com.haulmont.addon.bproc:bproc-global:1.2.2')
}

def mssql = 'com.microsoft.sqlserver:mssql-jdbc:7.2.2.jre8'

configure([globalModule, coreModule, webModule]) {
    apply(plugin: 'java')
    apply(plugin: 'maven')
    apply(plugin: 'cuba')

    dependencies {
            testCompile('org.junit.jupiter:junit-jupiter-api:5.5.2')
            testCompile('org.junit.jupiter:junit-jupiter-engine:5.5.2')
            testCompile('org.junit.vintage:junit-vintage-engine:5.5.2')  
        }

    task sourceJar(type: Jar) {
        from file('src')
        classifier = 'sources'
    }

    artifacts {
        archives sourceJar
    } 
    test {
        useJUnitPlatform()
    }
}


configure(globalModule) {
    entitiesEnhancing {
        main {
            enabled = true
        }
    }

    dependencies {
        if (!JavaVersion.current().isJava8()) {
            runtime('javax.xml.bind:jaxb-api:2.3.1')
            runtime('org.glassfish.jaxb:jaxb-runtime:2.3.1')
        }

        // Redis dependencies
        compile "org.springframework.data:spring-data-redis:2.3.0.RELEASE"
        compile "redis.clients:jedis:3.3.0"
        compile "com.fasterxml.jackson.core:jackson-databind:2.13.0"
    }

    entitiesEnhancing {
        main {
            enabled = true
        }
    }
}

configure(coreModule) {

    configurations {
        jdbc
        dbscripts
    }

    sourceSets {
        main {
            resources {
                srcDir 'src'
                include 'com/company/clinic/persistence.xml'
            }
        }
    }

    dependencies {
        implementation(globalModule)
        compileOnly(servletApi)
        jdbc(mssql) { exclude(group: 'com.microsoft.azure', module: 'azure-keyvault') }
        testRuntime(mssql) { exclude(group: 'com.microsoft.azure', module: 'azure-keyvault') }

        implementation "com.haulmont.cuba:cuba-core:$cubaVersion"
        implementation "com.haulmont.reports:reports-core:$cubaVersion"
    }

    task cleanConf(description: 'Cleans up conf directory', type: Delete) {
        delete "$cuba.appHome/${modulePrefix}-core/conf"
    }

    task deploy(dependsOn: [assemble, cleanConf], type: CubaDeployment) {
        appName = "${modulePrefix}-core"
        appJars(modulePrefix + '-global', modulePrefix + '-core')
    }

    task createDb(dependsOn: assembleDbScripts, description: 'Creates local database', type: CubaDbCreation) {
    }

    task updateDb(dependsOn: assembleDbScripts, description: 'Updates local database', type: CubaDbUpdate) {
    }
}

configure(webModule) {
    configurations {
        webcontent
    }

    dependencies {
        compileOnly(servletApi)
        compile(globalModule)
    }

    task webArchive(type: Zip) {
        from file("$buildDir/web")
        from file('web')
        classifier = 'web'
    }

    artifacts {
        archives webArchive
    }

    task deployConf(type: Copy) {
        from file('src')
        include "com/company/clinic/**"
        into "$cuba.appHome/${modulePrefix}/conf"
    }

    task clearMessagesCache(type: CubaClearMessagesCache) {
        appName = "${modulePrefix}"
    }
    deployConf.dependsOn clearMessagesCache

    task cleanConf(description: 'Cleans up conf directory', type: Delete) {
        delete "$cuba.appHome/${modulePrefix}/conf"
    }

    task deploy(dependsOn: [assemble, cleanConf], type: CubaDeployment) {
        appName = "${modulePrefix}"
        appJars(modulePrefix + '-global', modulePrefix + '-web')
    }

    task buildScssThemes(type: CubaWebScssThemeCreation)

    task deployThemes(type: CubaDeployThemeTask, dependsOn: buildScssThemes)

    assemble.dependsOn buildScssThemes

    task themesJar(type: Jar) {
        from file('themes')
        classifier = 'themes'
    }

    artifacts {
        archives themesJar
    }
}

task undeploy(type: Delete, dependsOn: ":${modulePrefix}-web:cleanConf") {
    delete("$cuba.tomcat.dir/shared")
    delete("$cuba.tomcat.dir/webapps/${modulePrefix}-core")
    delete("$cuba.tomcat.dir/webapps/${modulePrefix}")
}

task restart(dependsOn: ['stop', ":${modulePrefix}-core:deploy", ":${modulePrefix}-web:deploy"], description: 'Redeploys applications and restarts local Tomcat') {
    doLast {
        ant.waitfor(maxwait: 6, maxwaitunit: 'second', checkevery: 2, checkeveryunit: 'second') {
            not {
                socket(server: 'localhost', port: '8787')
            }
        }
    }
}

task buildUberJar(type: CubaUberJarBuilding) {
    singleJar = true
    appName = 'clinic'
    coreModule = project(':app-core')
    webModule = project(':app-web')

    appProperties = [
            'cuba.dbmsType': 'mssql',
            'cuba.dbmsVersion': '2012',
            'cuba.dataSourceProvider': 'application',
            'cuba.dataSource.jdbcUrl': 'jdbc:sqlserver://localhost:1433;databaseName=clinic',
            'cuba.dataSource.username': 'anicolcl',
            'cuba.dataSource.password': 'Elalmendro.33',
            'cuba.dataSource.driverClassName': 'com.microsoft.sqlserver.jdbc.SQLServerDriver',
            'cuba.dataSource.connectionTestQuery': 'SELECT 1',
            'cuba.automaticDatabaseUpdate': true,
            'cuba.logDir': '/app/logs',
            'cuba.tempDir': '/app/temp',
            'cuba.confDir': '/app/config',
            'cuba.fileStorageDir': '/app/filestorage',
            'cuba.webContextName': 'app',
            'cuba.connectionUrlList': 'http://localhost:8080/app',
            'cuba.availableLocales': 'English|en',
            'cuba.localeSelectVisible': 'false'
    ]

    logbackConfigurationFile = 'etc/uber-jar-logback.xml'
    webPort = 8080

    doFirst {
        copy {
            from 'modules/core/src/com/company/clinic/persistence.xml'
            into 'build/resources/main/com/company/clinic'
        }
    }
}


restart.finalizedBy start

